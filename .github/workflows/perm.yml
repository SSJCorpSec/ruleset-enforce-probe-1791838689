name: perm-probe
on:
  pull_request:
jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
    steps:
      - name: show token permissions as seen by the API
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== event: $GITHUB_EVENT_NAME  head_repo_fork: ${{ github.event.pull_request.head.repo.fork }} ==="
          echo "--- attempt a CONTENTS WRITE to the base repo default branch ---"
          code=$(curl -s -o /tmp/o.json -w '%{http_code}' -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/contents/fork-token-write-probe.txt" \
            -d "{\"message\":\"fork token write probe\",\"content\":\"eA==\",\"branch\":\"main\"}")
          echo "CONTENTS_WRITE_HTTP=$code"; head -c 400 /tmp/o.json; echo
          echo "--- attempt an ISSUE CREATE (issues: write declared) ---"
          code2=$(curl -s -o /tmp/o2.json -w '%{http_code}' -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/issues" \
            -d '{"title":"fork token issue probe"}')
          echo "ISSUE_CREATE_HTTP=$code2"; head -c 300 /tmp/o2.json; echo
